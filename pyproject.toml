[project]
name = "pocketjournal"
version = "0.1.0"
description = "Print-ready pocket notebook generator (half-letter sheets, hand-bound)"
requires-python = ">=3.10"
dependencies = ["reportlab>=4", "pypdfium2>=4", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=4"]

[project.scripts]
pocketjournal = "pocketjournal.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pocketjournal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
